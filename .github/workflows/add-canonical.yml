name: Add canonical tags

on:
  push:
    paths:
      - '.github/workflows/add-canonical.yml'

permissions:
  contents: write

jobs:
  canonical:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add canonical tags to HTML files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          base = 'https://www.solasolucoesinteligentes.com.br'
          changed = []

          for path in sorted(Path('.').glob('*.html')):
              text = path.read_text(encoding='utf-8')
              original = text

              if path.name == 'index.html':
                  canonical = f'{base}/'
              else:
                  canonical = f'{base}/{path.name}'

              tag = f'<link rel="canonical" href="{canonical}">' 

              # Remove any existing canonical tag, then insert exactly one before <title>.
              text = re.sub(r'<link\s+rel=["\']canonical["\'][^>]*>', '', text, flags=re.I)
              if '<title>' in text:
                  text = text.replace('<title>', tag + '<title>', 1)
              else:
                  raise SystemExit(f'<title> ausente em {path}')

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          print('Arquivos alterados:')
          for name in changed:
              print('-', name)

          # Audit: every HTML file must have exactly one canonical with expected URL.
          for path in sorted(Path('.').glob('*.html')):
              text = path.read_text(encoding='utf-8')
              expected = f'{base}/' if path.name == 'index.html' else f'{base}/{path.name}'
              matches = re.findall(r'<link\s+rel=["\']canonical["\']\s+href=["\']([^"\']+)["\']\s*>', text, flags=re.I)
              if matches != [expected]:
                  raise SystemExit(f'Canonical inválido em {path}: {matches} esperado {expected}')

          PY

          git diff --check
          git status --short

      - name: Commit canonical tags
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Nenhuma alteração necessária.'
            exit 0
          fi
          git config user.name 'Solarca SEO Setup'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html'
          git commit -m 'Add canonical URLs to all pages'
          git push
